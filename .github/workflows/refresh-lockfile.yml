name: Refresh npm lockfile

on:
  push:
    branches:
      - phase-1c-merchant-portal
    paths:
      - .github/workflows/refresh-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-1c-merchant-portal

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regenerate package-lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh npm lockfile for deterministic CI"
          git push origin HEAD:phase-1c-merchant-portal

name: HK Family Fun Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hkfamilyfun-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Enforce password-only Admin auth contract
        shell: bash
        run: |
          set -euo pipefail
          login_file="app/admin/login/page.tsx"
          grep -q 'signInWithPassword' "$login_file"
          if grep -Eqi 'auth\.mfa|aal2|authenticator|one-time-code|name="otp"|name="totp"|twoFactor|two-factor' "$login_file"; then
            echo "Unexpected MFA/2FA implementation detected in Admin login"
            exit 1
          fi

      - name: TypeScript check
        run: npm run type-check

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

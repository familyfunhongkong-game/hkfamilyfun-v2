name: Upgrade Runtime Security Dependencies

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Remove unused legacy i18n dependencies
        run: npm uninstall i18next next-i18next

      - name: Upgrade supported runtime
        run: |
          npm install --save-exact next@16.3.6 react@19.2.0 react-dom@19.2.0 react-leaflet@5.0.0 lucide-react@latest
          npm install --save-dev --save-exact @types/react@19 @types/react-dom@19 eslint@9 eslint-config-next@16.3.6 @typescript-eslint/eslint-plugin@latest @typescript-eslint/parser@latest

      - name: Apply non-breaking audit fixes
        run: npm audit fix

      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit dependency baseline before lint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "Pin supported ESLint 9 baseline"
          git push origin HEAD:main

      - name: Lint upgraded runtime
        run: npm run lint

      - name: Type check upgraded runtime
        run: npm run type-check

      - name: Build upgraded runtime
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://uiyrbqqvgnfhfdhedmav.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Commit dependency upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade Next and React security baseline"
          git push origin HEAD:main

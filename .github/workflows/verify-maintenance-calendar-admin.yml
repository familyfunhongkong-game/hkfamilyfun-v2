name: Verify Maintenance Calendar Admin

on:
  push:
    branches:
      - ops-verify-maintenance-calendar-admin-20261011
    paths:
      - ".github/workflows/verify-maintenance-calendar-admin.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live maintenance and Admin login
        shell: bash
        run: |
          set -u
          curl -sS -D /tmp/home.headers -o /tmp/home.html --max-time 30 https://www.hkfamilyfun.com/
          echo "=== HOME HEADERS ==="
          cat /tmp/home.headers
          echo "=== HOME MARKERS ==="
          grep -o -E '網站升級進行中|精選親子活動|HK Family Fun' /tmp/home.html | head -20 || true

          curl -sS -D /tmp/admin.headers -o /tmp/admin.html --max-time 30 https://www.hkfamilyfun.com/admin/login
          echo "=== ADMIN HEADERS ==="
          cat /tmp/admin.headers
          echo "=== ADMIN MARKERS ==="
          grep -o -E '管理員登入|登入 Admin Portal|Admin 頁面已受保護|正在驗證管理員權限' /tmp/admin.html | head -20 || true

          test "$(grep -c '網站升級進行中' /tmp/home.html || true)" -gt 0
          test "$(grep -c '管理員登入' /tmp/admin.html || true)" -gt 0
          test "$(grep -c '登入 Admin Portal' /tmp/admin.html || true)" -gt 0

      - name: Verify calendar month navigation and Hong Kong holidays on staging
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          nov="$(curl -L -sS --fail --max-time 30 'https://hkfamilyfun-v2.vercel.app/calendar?month=2026-11')"
          echo "$nov" | grep -q "2026年11月"

          oct="$(curl -L -sS --fail --max-time 30 'https://hkfamilyfun-v2.vercel.app/calendar?month=2026-10')"
          echo "$oct" | grep -q "2026年10月"
          echo "$oct" | grep -q "國慶日"
          echo "$oct" | grep -q "重陽節翌日"
          echo "$oct" | grep -q "紅色日期 = 香港公眾假期"

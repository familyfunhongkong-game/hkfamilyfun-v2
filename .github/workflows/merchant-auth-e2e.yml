name: Merchant Auth E2E

# This workflow creates and deletes real Auth / merchant / event rows.
# Keep manual and fail-closed: it requires a DEDICATED staging Supabase project.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hkfamilyfun-merchant-auth-e2e
  cancel-in-progress: true

jobs:
  e2e:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run authenticated merchant workflow E2E
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_SITE_URL: ${{ secrets.E2E_SITE_URL }}
          REQUIRE_NOTIFICATION: "false"
        run: node scripts/merchant-auth-e2e.mjs

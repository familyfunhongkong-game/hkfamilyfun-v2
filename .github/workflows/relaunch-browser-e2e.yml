name: Rebuild V2 Browser Launch Gate

on:
  push:
    branches:
      - release/rebuild-v2-full-stack-qa-20261104
      - release/rebuild-v2-launch-candidate-20261109
  pull_request:
    branches:
      - release/rebuild-v2-member-integrated-20261104
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hkff-browser-release-gate
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PREVIEW_URL: https://hkfamilyfun-staging-git-release-rebuild-v2-ff887b-hk-family-fun.vercel.app
      EXPECTED_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install project and browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify protected preview access configured
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::Missing GitHub Actions secret VERCEL_AUTOMATION_BYPASS_SECRET for protected staging preview"
            exit 1
          fi
      - name: Wait for same-SHA Vercel preview
        run: |
          set -euo pipefail
          for attempt in {1..48}; do
            if curl --max-time 25 -fsSL -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$PREVIEW_URL/api/health" -o /tmp/hkff-preview-health.json && node -e 'const fs=require("fs");const h=JSON.parse(fs.readFileSync("/tmp/hkff-preview-health.json","utf8"));process.exit(h.ok===true && h.buildSha===process.env.EXPECTED_BUILD_SHA ? 0 : 1)'; then
              echo "Same-SHA preview healthy"; exit 0
            fi
            echo "Waiting for Vercel preview of SHA $EXPECTED_BUILD_SHA (attempt $attempt)"
            sleep 10
          done
          echo "Preview unavailable or wrong SHA"; exit 1
      - name: Mobile + desktop anonymous read-only E2E and SEO / API negative checks
        run: node scripts/relaunch-browser-smoke.mjs

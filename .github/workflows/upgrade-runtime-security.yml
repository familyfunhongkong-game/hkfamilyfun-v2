name: Upgrade Runtime Security Dependencies

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/upgrade-runtime-security.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Upgrade supported runtime
        run: |
          npm install --save-exact next@16.3.6 react@19.2.0 react-dom@19.2.0 react-leaflet@5.0.0 next-i18next@16.3.1
          npm install --save-dev --save-exact @types/react@19 @types/react-dom@19 eslint-config-next@16.3.6

      - name: Apply non-breaking audit fixes
        run: npm audit fix

      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit dependency upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade Next and React security baseline"
          git push origin HEAD:main

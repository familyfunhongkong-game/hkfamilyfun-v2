name: HK Family Fun Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hkfamilyfun-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Enforce password-only Admin auth contract
        shell: bash
        run: |
          set -euo pipefail
          login_file="app/admin/login/page.tsx"
          grep -q 'signInWithPassword' "$login_file"

          if grep -REqi             'auth\.mfa|aal2|authenticator|one-time-code|name="otp"|name="totp"|twoFactor|two-factor|signInWithOtp|signInWithOAuth'             app/admin; then
            echo "Unexpected MFA/OTP/OAuth login implementation detected in Admin Portal"
            exit 1
          fi

      - name: Enforce homepage merchandising order
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const source = fs.readFileSync("app/page.tsx", "utf8");

          const banner = source.indexOf('PromotionSlot banners={topBanners} variant="horizontal"');
          const featured = source.indexOf('{labels.featuredTitle}');
          const latest = source.indexOf('{labels.latestTitle}');

          if (banner < 0 || featured < 0 || latest < 0) {
            throw new Error("Homepage Banner / Featured / Latest sections are missing");
          }

          if (!(banner < featured && featured < latest)) {
            throw new Error("Homepage order must remain Banner → Featured → Latest");
          }

          if (!source.includes("event.updatedAt || event.publishedAt || event.date")) {
            throw new Error("Homepage latest events must keep update-time ordering");
          }

          if (!source.includes(".filter((event) => event.featured)")) {
            throw new Error("Homepage featured section must remain Admin-controlled");
          }
          NODE

      - name: Admin Analytics CSV export security and completeness
        run: npm run check:analytics-export

      - name: Admin Analytics summary correctness and permissions
        run: npm run check:analytics-summary

      - name: Verify inline notification review and safety
        run: node scripts/check-notification-inline-review.mjs

      - name: Verify Admin KPI and table navigation
        run: node scripts/test-admin-dashboard-navigation.mjs

      - name: Admin Growth Dashboard accuracy and permissions
        run: npm run check:admin-growth

      - name: Banner review before save and activation
        run: npm run check:banner-preview

      - name: Privacy and analytics consent checks
        run: npm run check:cookie-consent

      - name: Commerce model copy check
        run: npm run check:commerce-copy

      - name: Verify smart expiry cron cannot archive or modify event rows
        run: node scripts/check-safe-expiry-cron.mjs

      - name: Event card completeness check
        run: npm run check:event-cards

      - name: Recurring event closures and exceptions regression check
        run: node scripts/test-recurrence-cancellation.mjs

      - name: Saved Events search, filters and archive regression check
        run: node scripts/check-saved-events.mjs

      - name: Test next available saved-event occurrences
        run: node scripts/test-saved-occurrence.mjs

      - name: Different weekday opening hours and closure regression check
        run: node scripts/test-weekly-opening-hours-core.mjs

      - name: Today chronological timetable and mobile compact layout check
        run: npm run check:today-timeline

      - name: Event detail UX check
        run: npm run check:event-detail

      - name: Event SEO contract check
        run: npm run check:event-seo

      - name: Event data completeness check
        run: npm run check:event-data

      - name: Event calendar timezone check
        run: npm run check:event-calendar

      - name: Calendar icon catalogue and interaction regression check
        run: npm run check:calendar-icons

      - name: Events server preload check
        run: npm run check:events-ssr

      - name: Event display normalization check
        run: npm run check:event-display

      - name: Advertising order lifecycle check
        run: npm run check:advertising-orders

      - name: Production E2E isolation check
        run: npm run check:production-e2e

      - name: Launch documentation safety check
        run: npm run check:launch-docs

      - name: Production smoke coverage check
        run: npm run check:production-smoke

      - name: Production Smoke concurrency check
        run: npm run check:production-smoke

      - name: Supabase migration drift safety lock
        run: npm run check:migration-drift-lock

      - name: Calendar persona regression check
        run: npm run check:calendar-persona

      - name: Merchant preview schema check
        run: npm run check:merchant-preview

      - name: Approval workflow regression check
        run: npm run check:approval-workflow

      - name: Mobile event content regression check
        run: npm run check:event-mobile-content

      - name: Public catalogue never inherits signed-in sessions
        run: npm run check:public-event-auth-isolation

      - name: Event import extraction regression check
        run: npm run check:event-import

      - name: Unified account and Admin entry regression
        run: node scripts/check-account-hub.mjs

      - name: TypeScript check
        run: npm run type-check

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

name: Geocode Legacy Events

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Geocode published migrated events
        env:
          SUPABASE_URL: https://uiyrbqqvgnfhfdhedmav.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/geocode-legacy-events.mjs

name: Production Smoke Test

on:
  workflow_run:
    workflows: ["HK Family Fun CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hkfamilyfun-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://hkfamilyfun-v2.vercel.app
      SUPABASE_URL: https://uiyrbqqvgnfhfdhedmav.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Wait for Vercel Git deployment
        run: sleep 75

      - name: Check production routes
        shell: bash
        run: |
          set -euo pipefail

          routes=(
            "/"
            "/api/health"
            "/events"
            "/today"
            "/calendar"
            "/events/map"
            "/planner"
            "/merchant/login"
            "/merchant/register"
            "/merchant/events/import"
            "/admin"
          )

          for route in "${routes[@]}"; do
            echo "Checking $BASE$route"
            code="$(curl -L -sS -o /tmp/body.txt -w "%{http_code}" --max-time 30 "$BASE$route")"
            echo "HTTP $code"
            if [[ "$code" -lt 200 || "$code" -ge 400 ]]; then
              echo "FAILED $route"
              head -c 1500 /tmp/body.txt || true
              exit 1
            fi
          done

          health="$(curl -L -sS --max-time 30 "$BASE/api/health")"
          echo "$health"
          echo "$health" | grep -q '"ok":true'

      - name: Check one live event detail
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ]]; then
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY secret is missing"
            exit 1
          fi

          events="$(curl -sS --max-time 30             "$SUPABASE_URL/rest/v1/public_events_i18n?select=id&limit=1"             -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY"             -H "Authorization: Bearer $NEXT_PUBLIC_SUPABASE_ANON_KEY")"

          event_id="$(node -e '
            const rows = JSON.parse(process.argv[1]);
            if (!Array.isArray(rows) || !rows[0]?.id) process.exit(2);
            process.stdout.write(rows[0].id);
          ' "$events")"

          echo "Checking published event $event_id"
          code="$(curl -L -sS -o /tmp/event.html -w "%{http_code}" --max-time 30 "$BASE/events/$event_id")"
          test "$code" -ge 200
          test "$code" -lt 400

      - name: Check locale persistence endpoint
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -i -sS --max-time 30             -X POST "$BASE/api/locale"             -H "Content-Type: application/json"             --data '{"locale":"en"}')"
          echo "$headers" | grep -qi "set-cookie: hkff_locale=en"

      - name: Check protected APIs reject anonymous writes
        shell: bash
        run: |
          set -euo pipefail

          import_code="$(curl -sS -o /tmp/import.json -w "%{http_code}" --max-time 30             -X POST "$BASE/api/import-event"             -H "Content-Type: application/json"             --data '{"url":"https://example.com"}')"
          test "$import_code" = "401"

          translate_code="$(curl -sS -o /tmp/translate.json -w "%{http_code}" --max-time 30             -X POST "$BASE/api/translate-event"             -H "Content-Type: application/json"             --data '{"event_id":"00000000-0000-0000-0000-000000000000","fields":{}}')"
          test "$translate_code" = "401"

      - name: Confirm Vercel staging is noindex before domain cutover
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl -L -sS --max-time 30 "$BASE/")"
          echo "$html" | grep -qi "noindex"

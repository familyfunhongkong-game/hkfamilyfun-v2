name: Merchant Auth E2E

# This workflow creates and deletes real Auth / merchant / event rows.
# Keep it manual until HK Family Fun has a dedicated Supabase test project.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hkfamilyfun-merchant-auth-e2e
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run authenticated merchant workflow E2E
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUIRE_NOTIFICATION: "false"
        run: node scripts/merchant-auth-e2e.mjs

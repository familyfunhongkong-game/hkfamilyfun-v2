name: Auto Discover HK Family Events
# validation-run-6

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/auto-discover-events.yml"
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Discover new family events
        env:
          SUPABASE_URL: https://uiyrbqqvgnfhfdhedmav.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APPROVAL_EMAIL: ${{ secrets.APPROVAL_EMAIL }}
          SITE_URL: https://hkfamilyfun-v2.vercel.app
          MAX_NEW_EVENTS: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/auto-discover-events.mjs

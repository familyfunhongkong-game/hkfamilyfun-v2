name: Test HK LandsD Location API

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/test-hk-location-api.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/test-hk-location-api.mjs

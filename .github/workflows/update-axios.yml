name: Update Axios Security Patch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-axios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Upgrade axios
        run: npm install axios@1.20.0 --save --no-audit --no-fund

      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required."
          else
            git commit -m "Upgrade axios security patch"
            git push
          fi

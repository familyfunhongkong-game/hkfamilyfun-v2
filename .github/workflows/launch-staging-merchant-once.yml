name: One-off HKFF Staging Merchant Auth E2E (Launch 2026-11-09)

# Run once when this file is created. Subsequent commits cannot trigger it unless
# specifically labeled for this isolated QA. NEVER use Production credentials.
on:
  push:
    branches:
      - release/rebuild-v2-launch-candidate-20261109
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hkff-launch-staging-merchant-once
  cancel-in-progress: false

jobs:
  staging-e2e:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'test(launch): run isolated staging merchant E2E')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://gwoiocllrgdwuxzibcuu.supabase.co
      SUPABASE_ANON_KEY: ${{ secrets.HKFF_STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.HKFF_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      SITE_URL: https://hkfamilyfun-staging-git-release-rebuild-v2-ff887b-hk-family-fun.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      REQUIRE_NOTIFICATION: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify staging-only credentials and same SHA
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ANON_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          for attempt in {1..48}; do
            if curl --max-time 25 -fsSL -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$SITE_URL/api/health" -o /tmp/hkff-health.json && node -e 'const h=require("/tmp/hkff-health.json");process.exit(h.ok===true && h.buildSha===process.env.GITHUB_SHA?0:1)'; then
              echo "Staging deployment matches workflow SHA"; exit 0
            fi
            sleep 10
          done
          echo "::error::Staging deployment unavailable or SHA mismatch"
          exit 1
      - name: Isolated staging Merchant/Auth/Event/Notification/Recovery E2E with cleanup
        run: node scripts/merchant-auth-e2e.mjs

name: Validate Auto Discovery Dry Run

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/validate-auto-discovery-dry-run.yml"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run discovery without database writes
        env:
          SUPABASE_URL: https://uiyrbqqvgnfhfdhedmav.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCOVERY_DRY_RUN: "true"
          MAX_NEW_EVENTS: "10"
        run: node scripts/auto-discover-events.mjs

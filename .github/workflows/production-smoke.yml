name: Production Smoke Test

on:
  workflow_run:
    workflows: ["HK Family Fun CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Target URL. Use hkfamilyfun.com only after cutover."
        required: true
        default: "https://hkfamilyfun-v2.vercel.app"
        type: string
      index_expectation:
        description: "SEO mode expected on the target host"
        required: true
        default: "staging-noindex"
        type: choice
        options:
          - staging-noindex
          - production-index

permissions:
  contents: read
  statuses: read

concurrency:
  group: hkfamilyfun-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || 'https://hkfamilyfun-v2.vercel.app' }}
      INDEX_EXPECTATION: ${{ github.event_name == 'workflow_dispatch' && inputs.index_expectation || 'staging-noindex' }}

    steps:
      - name: Wait for matching Vercel Git deployment
        id: deployment_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          resolve_main_sha() {
            curl -sS --max-time 20 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" | node -e '
                let input = "";
                process.stdin.on("data", (chunk) => input += chunk);
                process.stdin.on("end", () => {
                  const body = JSON.parse(input);
                  process.stdout.write(body.sha || "");
                });
              '
          }

          current_main_sha="$(resolve_main_sha)"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            expected_sha="$current_main_sha"
          else
            expected_sha="${{ github.event.workflow_run.head_sha }}"
          fi

          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"

          if [[ -n "$current_main_sha" && "$expected_sha" != "$current_main_sha" ]]; then
            echo "Smoke run is stale: trigger=$expected_sha current_main=$current_main_sha"
            echo "should_test=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$expected_sha" ]]; then
            echo "Could not resolve latest main SHA"
            exit 1
          fi

          echo "Testing latest main commit: $expected_sha"

          for attempt in {1..30}; do
            status_json="$(curl -sS --max-time 20 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$expected_sha/status")"

            vercel_state="$(node -e '
              const body = JSON.parse(process.argv[1]);
              const hit = (body.statuses || []).find(
                (item) => item.context === "Vercel"
              );
              process.stdout.write(hit?.state || "");
            ' "$status_json")"

            echo "Attempt $attempt: Vercel status=$vercel_state for $expected_sha"

            if [[ "$vercel_state" == "success" ]]; then
              echo "should_test=true" >> "$GITHUB_OUTPUT"
              sleep 5
              exit 0
            fi

            if [[ "$vercel_state" == "failure" || "$vercel_state" == "error" ]]; then
              echo "Vercel deployment failed for $expected_sha"
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for Vercel deployment status for $expected_sha"
          exit 1

      - name: Check production routes
        if: steps.deployment_gate.outputs.should_test == 'true'
        shell: bash
        run: |
          set -euo pipefail

          routes=(
            "/"
            "/api/health"
            "/events"
            "/today"
            "/calendar"
            "/events/map"
            "/planner"
            "/merchant/login"
            "/merchant/register"
            "/merchant/events/import"
            "/admin"
            "/admin/login"
            "/admin/forgot-password"
            "/admin/system"
          )

          for route in "${routes[@]}"; do
            echo "Checking $BASE$route"
            code="$(curl -L -sS -o /tmp/body.txt -w "%{http_code}" --max-time 30 "$BASE$route")"
            echo "HTTP $code"
            if [[ "$code" -lt 200 || "$code" -ge 400 ]]; then
              echo "FAILED $route"
              head -c 1500 /tmp/body.txt || true
              exit 1
            fi
          done

          health="$(curl -L -sS --max-time 30 "$BASE/api/health")"
          echo "$health"
          EXPECTED_SHA="${{ steps.deployment_gate.outputs.expected_sha }}" node -e '
            const body = JSON.parse(process.argv[1]);
            const expected = process.env.EXPECTED_SHA || "";
            if (body?.ok !== true) throw new Error("health ok=false");
            if (body?.service !== "hkfamilyfun-v2") {
              throw new Error("target is not hkfamilyfun-v2");
            }
            if (!body?.buildSha || body.buildSha !== expected) {
              throw new Error(
                "target build SHA mismatch: expected=" + expected +
                " actual=" + (body?.buildSha || "missing")
              );
            }
          ' "$health"

      - name: Check HK Family Fun brand assets and social links
        if: steps.deployment_gate.outputs.should_test == 'true'
        shell: bash
        run: |
          set -euo pipefail

          curl -L -sS --fail --max-time 30 "$BASE/api/brand/family-fun-logo" -o /tmp/hkff-logo.png
          actual_sha="$(sha256sum /tmp/hkff-logo.png | awk '{print $1}')"
          test "$actual_sha" = "bf9f56f08f6a2cf522db388037e83c2d3363ebc5858400378efd6ead4ade9fa5"

          home_html="$(curl -L -sS --fail --max-time 30 "$BASE/")"
          echo "$home_html" | grep -q '/api/brand/family-fun-logo'
          echo "$home_html" | grep -q 'https://www.instagram.com/hk.familyfun'
          echo "$home_html" | grep -q 'https://www.facebook.com/hk.familyfun1112'
          echo "$home_html" | grep -q 'https://www.threads.com/@hk.familyfun'

      - name: Check one live event detail
        if: steps.deployment_gate.outputs.should_test == 'true'
        shell: bash
        run: |
          set -euo pipefail

          health="$(curl -L -sS --max-time 30 "$BASE/api/health")"
          event_id="$(node -e '
            const body = JSON.parse(process.argv[1]);
            if (!body?.samplePublicEventId) process.exit(2);
            process.stdout.write(body.samplePublicEventId);
          ' "$health")"

          echo "Checking published event $event_id"
          code="$(curl -L -sS -o /tmp/event.html -w "%{http_code}" --max-time 30 "$BASE/events/$event_id")"
          test "$code" -ge 200
          test "$code" -lt 400

      - name: Check missing event detail does not 500
        if: steps.deployment_gate.outputs.should_test == 'true'
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o /tmp/missing-event.html -w "%{http_code}" --max-time 30 "$BASE/events/00000000-0000-4000-8000-000000000000")"
          if [[ "$code" -ge 500 ]]; then
            echo "Missing event detail returned server error: HTTP $code"
            exit 1
          fi
          if grep -qiE "Application error|Internal Server Error|Cannot coerce the result to a single JSON object" /tmp/missing-event.html; then
            echo "Missing event detail rendered a framework/database error."
            exit 1
          fi

      - name: Check locale persistence endpoint
        if: steps.deployment_gate.outputs.should_test == 'true'
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -i -sS --max-time 30             -X POST "$BASE/api/locale"             -H "Content-Type: application/json"             --data '{"locale":"en"}')"
          echo "$headers" | grep -qi "set-cookie: hkff_locale=en"

      - name: Check locale-specific server rendering
        if: steps.deployment_gate.outputs.should_test == 'true'
        shell: bash
        run: |
          set -euo pipefail

          curl -sS --max-time 30 -c /tmp/hkff-en.cookies             -X POST "$BASE/api/locale"             -H "Content-Type: application/json"             --data '{"locale":"en"}' >/dev/null
          en_html="$(curl -L -sS --max-time 30 -b /tmp/hkff-en.cookies "$BASE/")"
          echo "$en_html" | grep -qi '<html lang="en"'

          curl -sS --max-time 30 -c /tmp/hkff-sc.cookies             -X POST "$BASE/api/locale"             -H "Content-Type: application/json"             --data '{"locale":"zh-Hans"}' >/dev/null
          sc_html="$(curl -L -sS --max-time 30 -b /tmp/hkff-sc.cookies "$BASE/")"
          echo "$sc_html" | grep -qi '<html lang="zh-Hans"'

      - name: Check Google Calendar OAuth runtime
        if: steps.deployment_gate.outputs.should_test == 'true'
        shell: bash
        run: |
          set -euo pipefail

          status_json="$(curl -L -sS --max-time 30 "$BASE/api/google-calendar/status")"
          echo "$status_json"
          echo "$status_json" | grep -q '"configured":true'

          headers="$(curl -sS -D - -o /dev/null --max-time 30 "$BASE/api/google-calendar/connect")"
          echo "$headers" | grep -Eqi '^location: https://accounts\.google\.com/'
          echo "$headers" | grep -q 'api%2Fgoogle-calendar%2Fcallback'

      - name: Check protected APIs reject anonymous writes
        if: steps.deployment_gate.outputs.should_test == 'true'
        shell: bash
        run: |
          set -euo pipefail

          import_code="$(curl -sS -o /tmp/import.json -w "%{http_code}" --max-time 30             -X POST "$BASE/api/import-event"             -H "Content-Type: application/json"             --data '{"url":"https://example.com"}')"
          test "$import_code" = "401"

          translate_code="$(curl -sS -o /tmp/translate.json -w "%{http_code}" --max-time 30             -X POST "$BASE/api/translate-event"             -H "Content-Type: application/json"             --data '{"event_id":"00000000-0000-0000-0000-000000000000","fields":{}}')"
          test "$translate_code" = "401"

          system_health_code="$(curl -sS -o /tmp/system-health.json -w "%{http_code}" --max-time 30 "$BASE/api/admin/system-health")"
          test "$system_health_code" = "401"

          geocode_code="$(curl -sS -o /tmp/geocode.json -w "%{http_code}" --max-time 30 "$BASE/api/geocode?q=Central")"
          test "$geocode_code" = "401"

      - name: Check SEO index mode
        if: steps.deployment_gate.outputs.should_test == 'true'
        shell: bash
        run: |
          set -euo pipefail

          html="$(curl -L -sS --max-time 30 "$BASE/")"

          if [[ "$INDEX_EXPECTATION" == "staging-noindex" ]]; then
            echo "$html" | grep -qi "noindex"
            echo "Staging noindex verified."
          elif [[ "$INDEX_EXPECTATION" == "production-index" ]]; then
            if echo "$html" | grep -Eqi 'name="robots"[^>]*content="[^"]*noindex|content="[^"]*noindex[^"]*"[^>]*name="robots"'; then
              echo "Production target is still noindex."
              exit 1
            fi

            echo "$html" | grep -Eqi 'rel="canonical"'
            echo "$html" | grep -Eqi 'https://(www\.)?hkfamilyfun\.com'
            echo "Production indexability and canonical host verified."
          else
            echo "Unknown INDEX_EXPECTATION=$INDEX_EXPECTATION"
            exit 1
          fi

      - name: Install CJK fonts for visual regression
        if: steps.deployment_gate.outputs.should_test == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Check rendered DOM for framework errors
        if: steps.deployment_gate.outputs.should_test == 'true'
        shell: bash
        run: |
          set -euo pipefail

          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"

          health="$(curl -L -sS --max-time 30 "$BASE/api/health")"
          event_id="$(node -e '
            const body = JSON.parse(process.argv[1]);
            if (!body?.samplePublicEventId) process.exit(2);
            process.stdout.write(body.samplePublicEventId);
          ' "$health")"

          routes=(
            "/"
            "/events"
            "/today"
            "/calendar"
            "/events/map"
            "/events/$event_id"
          )

          for route in "${routes[@]}"; do
            url="$BASE$route"
            echo "Rendering DOM $url"
            dom="$(timeout 45s "$browser"               --headless=new               --no-sandbox               --disable-gpu               --disable-dev-shm-usage               --virtual-time-budget=5000               --dump-dom               "$url" 2>/dev/null)"

            test "${#dom}" -gt 1000
            echo "$dom" | grep -qi '<main'
            if echo "$dom" | grep -Eqi 'data-nextjs-dialog|Application error|Internal Server Error'; then
              echo "Framework error detected on $route"
              exit 1
            fi
          done

      - name: Capture mobile and desktop visual regression screenshots
        if: steps.deployment_gate.outputs.should_test == 'true'
        shell: bash
        run: |
          set -euo pipefail

          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"

          if [[ -z "$browser" ]]; then
            echo "No Chrome/Chromium binary available on runner"
            exit 1
          fi

          health="$(curl -L -sS --max-time 30 "$BASE/api/health")"
          event_id="$(node -e '
            const body = JSON.parse(process.argv[1]);
            if (!body?.samplePublicEventId) process.exit(2);
            process.stdout.write(body.samplePublicEventId);
          ' "$health")"

          mkdir -p visual-smoke/mobile visual-smoke/desktop

          declare -A routes=(
            [home]="/"
            [events]="/events"
            [today]="/today"
            [calendar]="/calendar"
            [map]="/events/map"
            [event-detail]="/events/$event_id"
            [admin-login]="/admin/login"
          )

          for name in "${!routes[@]}"; do
            route="${routes[$name]}"
            url="$BASE$route"

            echo "Capturing mobile $url"
            timeout 45s "$browser"               --headless=new               --no-sandbox               --disable-gpu               --hide-scrollbars               --disable-dev-shm-usage               --virtual-time-budget=7000               --window-size=390,844               --screenshot="visual-smoke/mobile/$name.png"               "$url"

            echo "Capturing desktop $url"
            timeout 45s "$browser"               --headless=new               --no-sandbox               --disable-gpu               --hide-scrollbars               --disable-dev-shm-usage               --virtual-time-budget=7000               --window-size=1440,1000               --screenshot="visual-smoke/desktop/$name.png"               "$url"

            test -s "visual-smoke/mobile/$name.png"
            test -s "visual-smoke/desktop/$name.png"
          done

      - name: Upload visual regression artifact
        if: steps.deployment_gate.outputs.should_test == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hk-family-fun-visual-smoke
          path: visual-smoke/
          if-no-files-found: error
          retention-days: 14

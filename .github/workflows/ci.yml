name: HK Family Fun CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check automation scripts
        run: |
          node --check scripts/auto-discover-events.mjs
          node --check scripts/migrate-legacy-familyfun.mjs
          node --check scripts/compare-legacy-hashes.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run type-check

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://uiyrbqqvgnfhfdhedmav.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

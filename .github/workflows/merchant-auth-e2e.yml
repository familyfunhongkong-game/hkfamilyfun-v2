name: Merchant Auth E2E

# This workflow creates and deletes real Auth / merchant / event rows.
# Manual-only safety gate: never run database-mutating tests automatically.
# Creates and cleans up rows in the dedicated Staging Supabase project.
# Never supply Production service credentials to this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hkfamilyfun-merchant-auth-e2e
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run authenticated merchant workflow E2E
        env:
          SUPABASE_URL: https://gwoiocllrgdwuxzibcuu.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.HKFF_STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.HKFF_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: https://hkfamilyfun-staging-git-release-rebuild-v2-e120d3-hk-family-fun.vercel.app
          REQUIRE_NOTIFICATION: "false"
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Staging-only secrets HKFF_STAGING_SUPABASE_ANON_KEY and HKFF_STAGING_SUPABASE_SERVICE_ROLE_KEY are required"
            exit 1
          fi
          node scripts/merchant-auth-e2e.mjs
